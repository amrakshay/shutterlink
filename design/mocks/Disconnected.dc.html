      <span style="width: 8px; height: 8px; border-radius: 50%; background: #F2A33C;"></span>

    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #A3AFBA; max-width: 290px;">Trying to get back to <span style="color: #F2F5F7; font-weight: 500;">OnePlus 7</span>. Your shots are safe on it.</p>

    <div style="margin-top: 26px; width: 100%; max-width: 300px; height: 6px; border-radius: 999px; background: #1C232A; overflow: hidden;">
      <div style="width: 45%; height: 100%; background: #F2A33C;"></div>
    </div>

    <div style="width: 100%; background: #12171C; border: 1px solid #222A33; border-radius: 16px; padding: 16px; text-align: left;">
      <div style="font-size: 14px; font-weight: 600; margin-bottom: 10px;">Usually one of these</div>
      <ul style="margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.75; color: #A3AFBA;">
        <li>The phones drifted too far apart</li>
        <li>The far phone went to sleep or ran out of battery</li>
