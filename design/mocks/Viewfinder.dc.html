<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Viewfinder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; }
    a { color: #5AC8E8; } a:hover { color: #8FDCF0; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #FFFFFF; position: relative; overflow: hidden;">

  <div style="position: absolute; inset: 0; background: linear-gradient(170deg, #39434B 0%, #272F36 45%, #171C21 100%);"></div>
  <div style="position: absolute; left: 34px; top: 120px; width: 150px; height: 210px; border-radius: 8px; background: linear-gradient(160deg, #C9B288 0%, #8D7C5E 100%); opacity: 0.55;"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: linear-gradient(180deg, rgba(23,28,33,0) 0%, #12171B 100%);"></div>
  <div style="position: absolute; left: 118px; top: 330px; width: 154px; height: 300px; border-radius: 84px 84px 0 0; background: #0E1317; opacity: 0.86;"></div>
  <div style="position: absolute; left: 160px; top: 258px; width: 70px; height: 82px; border-radius: 36px; background: #0E1317; opacity: 0.86;"></div>

  <div style="position: absolute; left: 130px; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.10);"></div>
  <div style="position: absolute; left: 260px; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.10);"></div>
  <div style="position: absolute; top: 281px; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.10);"></div>
  <div style="position: absolute; top: 562px; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.10);"></div>

  <div style="position: absolute; left: 0; right: 0; top: 0; padding: 50px 16px 0; display: flex; align-items: center; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 7px; background: rgba(10,14,18,0.72); border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; padding: 7px 12px;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #5AC8E8;"></span>
      <span style="font-size: 12px; font-weight: 600;">OnePlus 7</span>
    </div>
    <div style="background: rgba(10,14,18,0.72); border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 500; color: #D4DBE1;">118 ms</div>
    <div style="background: rgba(10,14,18,0.72); border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 500; color: #D4DBE1;">78%</div>
    <div style="flex-grow: 1;"></div>
    <button type="button" aria-label="Settings" style="width: 38px; height: 38px; border-radius: 50%; background: rgba(10,14,18,0.72); border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="3" stroke="#FFFFFF" stroke-width="1.8"></circle>
        <path d="M12 3.5v2M12 18.5v2M20.5 12h-2M5.5 12h-2M18 6l-1.4 1.4M7.4 16.6 6 18M18 18l-1.4-1.4M7.4 7.4 6 6" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"></path>
      </svg>
    </button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 20px 34px; display: flex; flex-direction: column; gap: 18px;">

    <div style="display: flex; justify-content: center;">
      <a href="EnginePicker.dc.html" style="display: flex; align-items: center; gap: 8px; background: rgba(10,14,18,0.76); border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; padding: 9px 16px; text-decoration: none; color: #FFFFFF;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8.4" stroke="#5AC8E8" stroke-width="1.8" stroke-dasharray="36 10" stroke-linecap="round"></circle>
          <circle cx="12" cy="12" r="3" fill="#5AC8E8"></circle>
        </svg>
        <span style="font-size: 13px; font-weight: 600;">Shooting with ShutterLink</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 9.5l6 6 6-6" stroke="#B9C4CD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </a>
    </div>

    <div style="display: flex; justify-content: center; gap: 8px;">
      <button type="button" style="min-width: 46px; height: 34px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); background: rgba(10,14,18,0.76); color: #D4DBE1; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;">0.6×</button>
      <button type="button" style="min-width: 46px; height: 34px; border-radius: 999px; border: 1px solid #5AC8E8; background: #5AC8E8; color: #06181F; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer;">1×</button>
      <button type="button" style="min-width: 46px; height: 34px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); background: rgba(10,14,18,0.76); color: #D4DBE1; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;">2×</button>
      <button type="button" style="min-width: 46px; height: 34px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); background: rgba(10,14,18,0.76); color: #D4DBE1; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;">5×</button>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between;">

      <a href="Review.dc.html" aria-label="Last shot" style="width: 54px; height: 54px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.22); background: linear-gradient(150deg, #5B6B5A 0%, #2C3A36 100%); display: block;"></a>

      <a href="Countdown.dc.html" aria-label="Take photo" style="width: 78px; height: 78px; border-radius: 50%; background: #FFFFFF; border: 4px solid rgba(255,255,255,0.32); background-clip: padding-box; display: block;"></a>

      <button type="button" aria-label="Switch to front camera" style="width: 54px; height: 54px; border-radius: 50%; background: rgba(10,14,18,0.76); border: 1px solid rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 9a8 8 0 0 1 13.3-3.3L20 8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M20 4.5V8h-3.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M20 15a8 8 0 0 1-13.3 3.3L4 16" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M4 19.5V16h3.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>

    </div>

    <div style="display: flex; justify-content: center; gap: 10px;">
      <button type="button" style="display: flex; align-items: center; gap: 6px; background: transparent; border: none; color: #B9C4CD; font-size: 13px; font-weight: 600; font-family: inherit; padding: 6px 10px; cursor: pointer;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" stroke="#B9C4CD" stroke-width="1.8"></circle>
          <path d="M12 7.5V12l3 1.8" stroke="#B9C4CD" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
        3s
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 6px; background: transparent; border: none; color: #B9C4CD; font-size: 13px; font-weight: 600; font-family: inherit; padding: 6px 10px; cursor: pointer;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="2" stroke="#B9C4CD" stroke-width="1.8"></rect>
          <path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16" stroke="#B9C4CD" stroke-width="1.4"></path>
        </svg>
        Grid
      </button>
    </div>

  </div>

</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
