<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photo coming over</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; }
    a { color: #5AC8E8; } a:hover { color: #8FDCF0; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #080B0E; color: #FFFFFF; display: flex; flex-direction: column;">

  <div style="padding: 50px 16px 14px; display: flex; align-items: center; gap: 10px;">
    <div style="flex-grow: 1;">
      <div style="font-size: 15px; font-weight: 600;">Shot 4</div>
      <div style="font-size: 12px; color: #A3AFBA; margin-top: 1px;">Coming over from OnePlus 7</div>
    </div>
    <div style="font-size: 13px; font-weight: 600; color: #5AC8E8;">62%</div>
  </div>

  <div style="flex-grow: 1; position: relative; margin: 0 16px; border-radius: 18px; overflow: hidden; background: linear-gradient(170deg, #39434B 0%, #272F36 45%, #171C21 100%);">
    <div style="position: absolute; left: 30px; top: 70px; width: 136px; height: 190px; border-radius: 8px; background: linear-gradient(160deg, #C9B288 0%, #8D7C5E 100%); opacity: 0.30;"></div>
    <div style="position: absolute; left: 104px; top: 258px; width: 150px; height: 300px; border-radius: 82px 82px 0 0; background: #0E1317; opacity: 0.5;"></div>
    <div style="position: absolute; left: 145px; top: 190px; width: 68px; height: 80px; border-radius: 35px; background: #0E1317; opacity: 0.5;"></div>
    <div style="position: absolute; inset: 0; background: rgba(8,11,14,0.46);"></div>

    <div style="position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 0 40px;">
      <div style="width: 54px; height: 54px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.18); border-top-color: #5AC8E8; box-sizing: border-box;"></div>
      <div style="width: 100%; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.14); overflow: hidden;">
        <div style="width: 62%; height: 100%; background: #5AC8E8;"></div>
      </div>
      <div style="font-size: 13px; color: #D4DBE1;">2.4 MB of 3.8 MB</div>
    </div>
  </div>

  <div style="padding: 18px 16px 34px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; gap: 12px; align-items: flex-start; background: #0E1317; border: 1px solid #1E262E; border-radius: 15px; padding: 15px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="#A3AFBA" stroke-width="1.8"></circle>
        <path d="M12 11v5.5" stroke="#A3AFBA" stroke-width="1.8" stroke-linecap="round"></path>
        <circle cx="12" cy="7.8" r="1.1" fill="#A3AFBA"></circle>
      </svg>
      <div style="font-size: 13px; line-height: 1.5; color: #A3AFBA;">The full-size original is already safe on the far phone. If this transfer fails, nothing is lost.</div>
    </div>

    <button type="button" style="width: 100%; padding: 16px; border-radius: 15px; border: 1px solid #2A333C; background: transparent; color: #F2F5F7; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;">Skip and keep shooting</button>
  </div>

</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
