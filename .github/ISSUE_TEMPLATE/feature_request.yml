name: Feature request
description: Suggest something
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please read the scope section of [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) first.

        ShutterLink is a Bluetooth shutter button and deliberately nothing more. It installs on
        one phone, the other phone needs nothing, and no part of it touches a network. Proposals
        that keep all three true are the ones most likely to land.

        **Permanently out of scope:** anything needing the internet, and turning this into a
        general camera app with filters and editing.

        **A live preview and sending the photo back were both built, measured and removed** — not
        rejected on principle. On a congested network the preview ran one to two seconds behind
        reality, and a photo took thirteen seconds to transfer. See
        [docs/FINDINGS.md](../blob/main/docs/FINDINGS.md), sections 16 and 20, before proposing
        either again. A proposal that addresses *those measurements* is welcome; one that assumes
        they were never tried is not.

        A live preview while a third-party camera app holds the camera is not merely hard, it is
        impossible: that app holds the camera exclusively and no API exposes its frames.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you hit, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I have read the scope section and believe this fits
          required: true
        - label: This needs no internet access
          required: true
        - label: This needs nothing installed on the camera phone, or says plainly why it must
          required: true
