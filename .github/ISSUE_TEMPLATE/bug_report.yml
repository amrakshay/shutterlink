name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. ShutterLink is installed on one phone and pairs with another that
        has nothing installed on it. Almost every report turns on *which two phones* — so please
        fill in both, even if the problem seems to be on one of them.

  - type: dropdown
    id: part
    attributes:
      label: Where does it go wrong?
      options:
        - Making this phone visible
        - The other phone cannot find it
        - Pairing fails or is refused
        - Paired, but the app never says "Connected"
        - Connected, but the shutter does nothing
        - The self-timer
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations:
      required: true

  - type: input
    id: app-phone
    attributes:
      label: The phone running ShutterLink, and its Android version
      description: >
        This one has to be able to act as a Bluetooth HID device. Not every phone can, and that
        is the most common cause of "it never connects".
      placeholder: "Samsung M04 (SM-M045F), Android 14"
    validations:
      required: true

  - type: input
    id: camera-phone
    attributes:
      label: The camera phone, its Android version, and which camera app
      description: >
        The camera app matters: it decides whether the keystroke is a shutter. Please name it.
      placeholder: "OnePlus 7, Android 10, stock OnePlus Camera"
    validations:
      required: true

  - type: input
    id: key
    attributes:
      label: Which key is ShutterLink set to send?
      description: Shown at the bottom of the screen. Try the others before reporting.
      placeholder: "Volume up"

  - type: textarea
    id: logs
    attributes:
      label: App log
      description: |
        From the phone running ShutterLink, over ADB:
        ```
        adb logcat -d | grep -i shutterlink
        ```
        The two lines that matter say `registered=` and `connected=`.
      render: shell

  - type: textarea
    id: pairing
    attributes:
      label: Pairing details (only if they will not pair or stay connected)
      description: |
        Please confirm:
        - Bluetooth is on for both phones
        - The two phones appear in each other's Bluetooth settings as paired
        - You tapped "Make this phone visible" before searching from the other phone
        - Neither phone is in battery saver
