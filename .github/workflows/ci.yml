name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # No Android SDK here on purpose. The protocol module is a plain JVM
      # library, so its tests run in seconds with no emulator — if this job
      # ever needs the SDK, something has crept an android.* import into it.
      - name: Unit tests
        run: ./gradlew :protocol:test --console=plain

      - name: Check the protocol module stays free of Android
        run: |
          if grep -rn "^import android\." protocol/src/main/kotlin; then
            echo "protocol/ must not depend on Android — see CONTRIBUTING.md"
            exit 1
          fi
          echo "clean"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-test-results
          path: protocol/build/reports/tests/test
          if-no-files-found: ignore

  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          # Name what the build actually needs. The platform carries a minor
          # version now: "platforms;android-37" does not exist, and sdkmanager
          # reports it as not found rather than suggesting 37.2.
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'

      - name: Build
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Check the APK asks for nothing undocumented
        run: |
          # Read the BUILT APK, not our manifest and not an intermediate.
          # Libraries merge permissions of their own, and the intermediate
          # manifests differ from what actually ships (Play Services' DUMP
          # appears there and not in the APK), so the APK is the only honest
          # thing to check.
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -1)
          APK=app/build/outputs/apk/debug/app-debug.apk
          perms=$("$AAPT" dump permissions "$APK" \
            | grep "^uses-permission:" \
            | sed "s/^uses-permission: name='//; s/'.*$//" | sort -u)
          echo "$perms"
          missing=0
          for perm in $perms; do
            name="${perm##*.}"
            if ! grep -q "$name" SECURITY.md; then
              echo "::error::$perm is in the APK but not in SECURITY.md"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "every permission in the APK is documented"
          exit $missing

      - name: Check the app still cannot reach the internet
        run: |
          # SECURITY.md and the README both promise this. Enforce it, rather
          # than trusting that nobody adds a library that wants the network.
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -1)
          if "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk \
              | grep -q "android.permission.INTERNET"; then
            echo "::error::something added the INTERNET permission — see SECURITY.md"
            exit 1
          fi
          echo "no INTERNET permission in the APK"

      - uses: actions/upload-artifact@v4
        with:
          name: shutterlink-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
